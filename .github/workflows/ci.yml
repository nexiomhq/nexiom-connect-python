name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.10"

      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy

  test:
    name: Python ${{ matrix.python }} (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        resolution: [locked]
        include:
          - python: "3.10"
            resolution: lowest-direct

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install locked dependencies
        if: matrix.resolution == 'locked'
        run: uv sync --locked

      # The oldest httpx and anyio this package allows, so its lower bounds stay true.
      - name: Install lowest dependencies
        if: matrix.resolution == 'lowest-direct'
        run: uv sync --resolution lowest-direct

      - run: uv run pytest

  package:
    name: Package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"

      - run: uv build
      - run: uvx twine check --strict dist/*

      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/consumer --python 3.10
          uv pip install --python /tmp/consumer dist/*.whl
          cd /tmp
          /tmp/consumer/bin/python - <<'PY'
          import importlib.resources
          import zipfile
          from pathlib import Path

          import nexiom_connect

          wheel = next(Path("${{ github.workspace }}/dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()

          assert importlib.resources.files("nexiom_connect").joinpath("py.typed").is_file()
          assert not [name for name in names if name.startswith(("tests/", "examples/"))], names
          assert nexiom_connect.NexiomConnect("nc_smoke_test").webhooks is not None

          print("nexiom-connect", nexiom_connect.__version__, "installs and imports")
          PY

  release-version:
    name: Release tag matches __version__
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/verify_release_version.py
