[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nexiom-connect"
dynamic = ["version"]
description = "The official Nexiom Connect SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nexiom Technologies" }]
keywords = ["nexiom", "nexiom-connect", "email", "whatsapp", "contacts", "webhooks", "sdk", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AnyIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.0",
  "httpx>=0.27.0,<1",
]

[project.urls]
Homepage = "https://github.com/nexiomhq/nexiom-connect-python"
Documentation = "https://github.com/nexiomhq/nexiom-connect-python#readme"
Source = "https://github.com/nexiomhq/nexiom-connect-python"
Issues = "https://github.com/nexiomhq/nexiom-connect-python/issues"
Changelog = "https://github.com/nexiomhq/nexiom-connect-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "ruff>=0.11",
  "trio>=0.27",
  "typing-extensions>=4.6",
]

[tool.uv]
required-version = ">=0.9"

[tool.hatch.version]
path = "src/nexiom_connect/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/CHANGELOG.md",
  "/LICENSE",
  "/NOTICE",
  "/README.md",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexiom_connect"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]
xfail_strict = true

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests", "examples"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "PIE", "RET", "S", "N",
  "ANN", "TC", "PTH", "PL", "PERF", "FURB", "T20", "DTZ", "ERA",
]
ignore = [
  "ANN401",  # JSON payloads are Any at the transport boundary.
  "E501",    # The formatter governs line length.
  "PLR0911", # Validation helpers return early by design.
  "PLR0912",
  "PLR0913", # Methods mirror the API's keyword arguments.
  "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "RUF001", # Tests use look-alike digits on purpose.
  "S101",
  "S105",
  "S106",
]
"examples/**" = ["T201", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["nexiom_connect"]

[tool.ruff.format]
docstring-code-format = true
